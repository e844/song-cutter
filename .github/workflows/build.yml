name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SongCutter-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: SongCutter-Android.apk

  android-device:
    name: Android emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          working-directory: android
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            mkdir -p ../shots && adb pull /sdcard/Android/data/com.king400.songcutter/files/shots ../shots || true
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          ls -R shots || true
          if ls shots/shots/*.png >/dev/null 2>&1; then
            gh release view android-screenshots >/dev/null 2>&1 || gh release create android-screenshots --title "Android screenshots" --notes "צילומי מסך מהבדיקה באמולטור" --prerelease
            gh release upload android-screenshots shots/shots/*.png --clobber
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-report
          path: android/app/build/reports/

  windows:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: ffmpeg (LGPL build, includes the LAME MP3 encoder)
        run: |
          curl -sSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
          unzip -q ff.zip -d ff
          mkdir -p bin
          cp ff/*/bin/ffmpeg.exe bin/
          cp ff/*/LICENSE.txt bin/FFMPEG-LICENSE.txt
          rm -rf ff ff.zip
          ./bin/ffmpeg.exe -hide_banner -encoders | grep -E "libmp3lame|aac"
      - name: Unit tests (real cuts with ffmpeg)
        run: SC_FFMPEG="$PWD/bin/ffmpeg.exe" npm test
      - name: Package
        run: >
          npx @electron/packager . SongCutter --platform=win32 --arch=x64
          --icon=build/icon.ico --asar --out=out --overwrite
          --app-copyright="king400" --win32metadata.ProductName="Song Cutter by king400"
          --win32metadata.CompanyName="king400" --win32metadata.FileDescription="Song Cutter by king400"
          --ignore="^/test" --ignore="^/out" --ignore="^/bin" --extra-resource=bin
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/SongCutter-win32-x64 -DestinationPath "$env:GITHUB_WORKSPACE/SongCutter-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: SongCutter-Windows.zip

  release:
    name: Publish downloads
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/* --repo "${{ github.repository }}" \
            --title "חותך שירים – בנייה ${{ github.run_number }}" --notes "נוצר ע״י king400 · Windows (EXE) + Android (APK) · MP3 ‏320kbps" --latest
